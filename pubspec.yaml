name: pureair_v2
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.4

dependencies:
  bloc: ^9.0.0
  cached_network_image: ^3.4.1
  cloud_firestore: ^5.5.0
  cloud_firestore_odm: ^1.0.0-dev.88
  collection: ^1.18.0
  cupertino_icons: ^1.0.2
  custom_map_markers: ^0.0.2+1
  dartz: ^0.10.1
  dio: ^5.7.0
  envied: ^1.0.0
  equatable: ^2.0.5
  firebase_auth: ^5.3.3
  firebase_core: ^3.8.0
  fl_chart: ^1.0.0
  flag: ^7.0.0
  flex_color_scheme: ^8.0.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_gen: ^5.8.0
  flutter_hooks: ^0.21.2
  flutter_map: ^8.1.1
  flutter_map_cancellable_tile_provider: ^3.0.2
  flutter_osm_plugin: ^1.3.6
  flutter_secure_storage: ^9.2.2
  geocoding: ^4.0.0
  geolocator: ^14.0.1
  get_it: ^8.0.2
  go_router: ^15.1.2
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.2
  hooks_riverpod: ^2.6.1
  injectable: ^2.5.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  latlong2: ^0.9.1
  logger: ^2.5.0
  lottie: ^3.3.0
  objectbox: ^4.0.3
  objectbox_flutter_libs: ^4.0.3
#  open_mail_app: ^0.4.5
  osm_flutter_hooks: ^1.4.1
  path: any
  path_provider: any
  phosphor_flutter: ^2.1.0
  responsive_framework: ^1.5.1
  retrofit: ^4.4.1
  rxdart: ^0.28.0
  shared_preferences: ^2.3.3
  shimmer_animation: ^2.2.1
  skeletonizer: ^2.0.1
  table_calendar: ^3.1.2
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.4.13
  cloud_firestore_odm_generator: ^1.0.0-dev.89
  envied_generator: ^1.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  go_router_builder: ^2.9.0
  injectable_generator: ^2.6.2
  json_serializable: ^6.8.0
  mockito: ^5.4.4
  objectbox_generator: ^4.0.3
  retrofit_generator: ^9.1.5
  very_good_analysis: ^8.0.0

flutter_gen:
  output: lib/src/core/theme

  integrations:
    lottie: true

  assets:
    enabled: true
    outputs:
      class_name: PureAirAssets
  
  fonts:
    outputs:
      class_name: PureAirFontFamily
  

flutter:
  uses-material-design: true
  assets:
    - assets/animations/lottie-loader.json

  fonts: 
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Light.ttf
          weight: 300
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
