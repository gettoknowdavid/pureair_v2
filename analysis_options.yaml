include: package:very_good_analysis/analysis_options.yaml
linter:
  rules:
    public_member_api_docs: false
analyzer:
  errors:
    invalid_annotation_target: ignore
    avoid_final_parameters: ignore
  plugins:
    - custom_lint
  exclude:
    - lib/objectbox.g.dart
    - "**/*.g.dart"
    - "**/*.freezed.dart"